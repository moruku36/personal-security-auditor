name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e . ruff mypy
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: python -m unittest discover -s tests
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Scan Git history without printing findings
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3 >/dev/null 2>&1
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --no-banner . >/dev/null 2>&1
