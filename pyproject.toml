[build-system]
requires = ["setuptools>=65", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-security-auditor"
version = "0.2.0"
description = "Local-first personal security audit with metadata-only secret discovery"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kentaro Mori"}]
dependencies = []

[project.scripts]
security-audit = "security_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
